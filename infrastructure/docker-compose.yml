services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devpassword}
      MYSQL_DATABASE: ai_accounts_payable
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  # Optional: uploaded invoice documents are scanned via this ClamAV daemon when
  # backend's CLAMAV_HOST=clamav is set (see backend/src/services/virusScanService.js).
  # Skipped by default (no CLAMAV_HOST in backend/.env.example) since the virus
  # definitions download makes first boot slow — opt in once you actually need it.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - '3310:3310'
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s # virus definition download on first boot

  ai-service:
    build:
      context: ../ai-service
    restart: unless-stopped
    env_file:
      - ../ai-service/.env
    ports:
      - '8000:8000'

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '5000:5000'

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../worker/.env
    environment:
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - '4173:4173'
    depends_on:
      - backend

volumes:
  mysql_data:
